name: crawl

on:
  schedule:
    - cron: "0 */6 * * *" # 6시간마다 (UTC 기준)
  workflow_dispatch: {} # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r crawler/requirements.txt
      - run: python crawler/crawl.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      - name: 변경된 데이터 커밋
        run: |
          git config user.name "crawler-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/items.json
          git diff --cached --quiet || (git commit -m "data: update" && git push)
